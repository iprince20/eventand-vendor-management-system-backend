services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventify
      POSTGRES_USER: eventify
      POSTGRES_PASSWORD: eventify
    ports:
      - "5432:5432"
    volumes:
      - eventify-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventify -d eventify"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/eventify
      DATABASE_USERNAME: eventify
      DATABASE_PASSWORD: eventify
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  eventify-postgres:
